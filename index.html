function gc(){var d=dk(G('ge').value);if(!d)return;var c='NQ-'+d.id+'-'+(100000+Math.floor(Math.random()*900000))+'-'+G('gn').value+'-'+d.qs.length;
G('gcode').innerHTML='<input type=text readonly value="'+c+'" onclick="this.select()"><button data-a=gsh data-i="'+c+'">ಕೋಡ್ ಕಳುಹಿಸಿ</button>'}
function gb(){var c=G('gin').value.trim(),nm=G('gname').value.trim().replace(/\|/g,''),p=c.split('-'),d=dk(p[1]);
if(!nm||p[0]!='NQ'||!d||p.length<5)return alert('ಹೆಸರು ಮತ್ತು ಸರಿಯಾದ ಕೋಡ್ ಹಾಕಿ.');

V={id:d.id,mode:'a',ex:1,grp:c,name:nm,t0:Date.now(),ans:[],i:0,s:0,m:[],a:null,x:pickq(d,+p[2],+p[3])};qzx()}

function gl(){var c0='',rows={};G('gr').value.split(/\n+/).forEach(function(l){var f=l.trim().split('|');if(f[0]!='NQR'||f.length<5)return;var p=f[1].split('-'),d=dk(p[1]);if(!d||(c0&&f[1]!=c0))return;c0=f[1];
var x=pickq(d,+p[2],+p[3]),a=f[4].split('').map(function(c){return c=='x'?null:+c}),r={n:f[2],s:sc(d,x,a),t:+f[3]},o=rows[r.n];if(!o||r.s>o.s||(r.s==o.s&&r.t<o.t))rows[r.n]=r});

function pm(){$.innerHTML='<h2>👤 ಒಂದೇ ಫೋನ್‌ನಲ್ಲಿ ಹಲವರು</h2><div class=c><p class=m>ಹೆಸರುಗಳನ್ನು ಪ್ರತಿ ಸಾಲಿಗೆ ಒಂದರಂತೆ ಬರೆಯಿರಿ (2 ರಿಂದ 8). ಎಲ್ಲರಿಗೂ ಒಂದೇ ಪ್ರಶ್ನೆಗಳು.</p><textarea id=pt></textarea><select id=pd>'+ops(all().map(function(d){return[d.id,d.name]}))+'</select> <select id=pn><option>10</option><option>20</option></select><br><button class=p data-a=pst>ಶುರು ಮಾಡಿ</button></div><button data-a=gx>ಹಿಂದೆ</button>'}

$.innerHTML='<h2>🏆 ಫಲಿತಾಂಶ</h2>'+board(P.res)+'<button class=p data-a=pky>ಸರಿ ಉತ್ತರಗಳನ್ನು ನೋಡಿ</button><button data-a=h>ಮುಖಪುಟ</button>'}
function ppk(){var d=dk(P.id),h='<h2>ಸರಿ ಉತ್ತರಗಳು</h2>';P.x.forEach(function(n,i){var q=d.qs[n];h+='<div class=c><b>'+(i+1)+'. '+E(q.q)+'</b><br>ಸರಿ ಉತ್ತರ: <b>'+E(q.o[q.a])+'</b>'+(q.e?'<br><span class=m>'+E(q.e)+'</span>':'')+'</div>'});$.innerHTML=h+'<button data-a=h>ಮುಖಪುಟ</button>'}
function hi(){var h='<h2>📊 ಇತಿಹಾಸ (ಕೊನೆಯ 30 ಆಟಗಳು)</h2>';

function bk(){var j=JSON.stringify({p:S.p,k:S.k,u:S.u,h:S.h,b:S.b,n:S.n,t:S.t,z:S.z,x:S.x,hs:S.hs});
$.innerHTML='<h2>💾 ಬ್ಯಾಕಪ್</h2><div class=c><p class=m>ಈ ಪಠ್ಯವನ್ನು ನಕಲು ಮಾಡಿ Notes ನಲ್ಲಿ ಉಳಿಸಿ. ಬೇರೆ ಫೋನ್‌ನಲ್ಲಿ ಅಥವಾ ಡೇಟಾ ಅಳಿದ ನಂತರ ಇದೇ ಪಠ್ಯವನ್ನು ಈ ಬಾಕ್ಸ್‌ನಲ್ಲಿ ಹಾಕಿ ಮರುಸ್ಥಾಪಿಸಿ.</p><textarea id=bj>'+E(j)+'</textarea><button class=p data-a=cp>ನಕಲು ಮಾಡಿ</button><button data-a=rs>ಮರುಸ್ಥಾಪಿಸಿ</button> <span id=cm class=m></span></div><button data-a=h>ಹಿಂದೆ</button>'}

t.split(/\n+/).forEach(function(l){var f=l.split('|').map(function(x){return x.trim()}),r='';

S.u.push({id:'u'+Date.now(),name:document.getElementById('nm').value||'ನನ್ನ ಕ್ವಿಜ್',qs:qs,u:1});sv();home()}

$.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,i=b.dataset.i;
if(a=='s')st(i,'a');else if(a=='sw')st(i,'w');else if(a=='sb')st(i,'b');else if(a=='k')pk(+b.dataset.k);else if(a=='t')nx();else if(a=='h')home();

else if(a=='ek'){V.ans[V.i]=+b.dataset.k;qzx()}else if(a=='ep'){V.i--;qzx()}else if(a=='en'){V.i++;qzx()}else if(a=='ej'){V.i=+b.dataset.j;qzx()}else if(a=='sx')sx();
else if(a=='gm')gm();else if(a=='g1'||a=='g2')gs(a,i||document.getElementById('gd').value);else if(a=='gk')gk(+b.dataset.k);

else if(a=='x'&&confirm('ಅಳಿಸಬೇಕೆ?')){S.u=S.u.filter(function(d){return d.id!=i});sv();home()}};
$.onchange=function(e){var i=e.target.id;if(i=='tt')S.t=e.target.checked;else if(i=='ex')S.x=e.target.checked;else if(i=='zz'){S.z=e.target.checked;document.body.className=S.z?'lg':''}else if(i=='nn')S.n=+e.target.value;sv()};
